<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a32">
  <title>호시노의 고요한 밤</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: block;
      background:
        radial-gradient(ellipse at 78% 88%, rgba(59, 92, 148, .22), transparent 38%),
        radial-gradient(ellipse at 67% 22%, rgba(61, 83, 132, .16), transparent 34%),
        linear-gradient(112deg, #090f1c 0%, #0d1526 38%, #111c31 72%, #0a1222 100%);
      color: #e8eaf3;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    }
    .night-scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(1px 1px at 43% 18%, rgba(235, 241, 255, .58) 98%, transparent),
        radial-gradient(1.5px 1.5px at 58% 13%, rgba(235, 241, 255, .48) 98%, transparent),
        radial-gradient(1px 1px at 69% 39%, rgba(235, 241, 255, .42) 98%, transparent),
        radial-gradient(1px 1px at 88% 27%, rgba(235, 241, 255, .5) 98%, transparent),
        radial-gradient(1px 1px at 79% 57%, rgba(235, 241, 255, .35) 98%, transparent),
        linear-gradient(180deg, transparent 60%, rgba(3, 7, 15, .24));
    }
    .night-scene::before {
      content: "";
      position: absolute;
      top: 10%;
      right: 20%;
      width: clamp(58px, 7vw, 108px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #dce5f4, #9baac4 72%, #7485a2);
      opacity: .72;
      box-shadow: 0 0 34px 8px rgba(133, 160, 207, .15), 0 0 110px 25px rgba(80, 111, 171, .11);
    }
    .night-scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 0 34%, rgba(7, 13, 25, .025) 62%, rgba(4, 9, 18, .1));
    }
    .night-note {
      position: fixed;
      z-index: 1;
      left: clamp(28px, 38vw, 720px);
      bottom: clamp(34px, 9vh, 92px);
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(7, 12, 27, .35);
    }
    .night-note small {
      display: block;
      margin-bottom: 14px;
      color: rgba(222, 230, 248, .6);
      font: 500 10px/1.4 "Segoe UI", sans-serif;
      letter-spacing: .28em;
    }
    .night-note p {
      margin: 0;
      color: rgba(245, 242, 238, .9);
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 400;
      letter-spacing: .08em;
    }
    body > canvas {
      position: fixed !important;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      background: transparent;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .night-note { left: 24px; bottom: 6vh; }
    }
  </style>
  <script src="./Core/live2dcubismcore.js"></script>
  <script type="module" crossorigin src="/assets/index-BBxn5z23.js"></script>
</head>
<body>
  <div class="night-scene" aria-hidden="true"></div>
  <div class="night-note" aria-hidden="true">
    <small>HOSHINO · NIGHT REST</small>
    <p>오늘도 수고했어.</p>
  </div>

</body>
</html>
